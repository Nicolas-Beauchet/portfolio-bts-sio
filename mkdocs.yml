site_name: Nicolas Beauchet - Portfolio BTS SIO SISR
site_url: https://nicolas-beauchet.github.io/portfolio-bts-sio/

theme:
  name: material
  language: fr
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Accueil: index.md
  - Tableau de Synthèse: synthese.md
  - Réalisations SISR:
    - Bloc 1 - Support & Services: bloc1.md
    - Bloc 2 - Administration Systèmes & Réseaux: bloc2.md
  - Veille Technologique:
    - Démarche & Outils: veille-outils.md
    - Sujet Zero Trust: veille-sujet.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

extra_css:
  - extra.css